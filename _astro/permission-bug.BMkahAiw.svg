<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="ui-monospace, 'JetBrains Mono', monospace">
  <style>
    .fail-pulse { animation: failPulse 1.4s ease-in-out infinite; }
    @keyframes failPulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    .fail-box { animation: failFlash 1.4s ease-in-out infinite; }
    @keyframes failFlash { 0%, 100% { stroke: #ff6b6b; } 50% { stroke: #7a1f1f; } }
    .flow-green { stroke-dasharray: 6 6; animation: flowGreen 1s linear infinite; }
    @keyframes flowGreen { to { stroke-dashoffset: -24; } }
    .check { animation: checkPulse 1.6s ease-in-out infinite; }
    @keyframes checkPulse { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
  </style>

  <rect width="900" height="300" fill="#12141a"/>

  <text x="30" y="34" fill="#ff6b6b" font-size="13" font-weight="700">BEFORE — Android 14</text>

  <rect x="30" y="52" width="220" height="54" rx="8" fill="#1c2030" stroke="#3a4160" stroke-width="1.5"/>
  <text x="140" y="74" fill="#f2f4ff" font-size="12" font-weight="700" text-anchor="middle">audio-only app</text>
  <text x="140" y="90" fill="#8a90b0" font-size="10.5" text-anchor="middle">requests media permissions</text>

  <path d="M250,79 H320" stroke="#8a90b0" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect class="fail-box" x="320" y="52" width="250" height="54" rx="8" fill="#1c2030" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="445" y="70" fill="#f2f4ff" font-size="11.5" font-weight="700" text-anchor="middle">also asks for</text>
  <text x="445" y="88" fill="#ffb0b0" font-size="11" text-anchor="middle">READ_MEDIA_VISUAL_USER_SELECTED</text>

  <path d="M570,79 H640" stroke="#8a90b0" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect class="fail-box" x="640" y="52" width="230" height="54" rx="8" fill="#1c2030" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="755" y="70" fill="#f2f4ff" font-size="11" text-anchor="middle">only grantable via the</text>
  <text x="755" y="88" fill="#f2f4ff" font-size="11" text-anchor="middle">photo/video picker — never shown</text>

  <path d="M755,106 V126" stroke="#ff6b6b" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text class="fail-pulse" x="755" y="148" fill="#ff8a8a" font-size="12" font-weight="700" text-anchor="middle">permission never granted</text>
  <text class="fail-pulse" x="755" y="166" fill="#ff8a8a" font-size="12" font-weight="700" text-anchor="middle">every write/delete fails, forever</text>

  <line x1="30" y1="196" x2="870" y2="196" stroke="#2a2f45" stroke-width="1"/>

  <text x="30" y="222" fill="#3fb950" font-size="13" font-weight="700">AFTER — patched via pnpm</text>

  <rect x="30" y="240" width="250" height="46" rx="8" fill="#1c2030" stroke="#3a4160" stroke-width="1.5"/>
  <text x="155" y="260" fill="#f2f4ff" font-size="11.5" font-weight="700" text-anchor="middle">only request it if the app</text>
  <text x="155" y="276" fill="#8a90b0" font-size="10.5" text-anchor="middle">declares photo/video access</text>

  <path class="flow-green" d="M280,263 H360" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="360" y="240" width="200" height="46" rx="8" fill="#1c2030" stroke="#3fb950" stroke-width="1.5"/>
  <text x="460" y="267" fill="#9df0b0" font-size="12" font-weight="700" text-anchor="middle">audio-only app: skipped</text>

  <path class="flow-green" d="M560,263 H630" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="630" y="240" width="240" height="46" rx="8" fill="#1c2030" stroke="#3fb950" stroke-width="1.5"/>
  <text class="check" x="750" y="267" fill="#9df0b0" font-size="12" font-weight="700" text-anchor="middle">✓ writes/deletes succeed</text>

  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ff6b6b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3fb950"/>
    </marker>
  </defs>
</svg>
