<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .box { fill: #F4F6F7; stroke: #CBD0D3; stroke-width: 1.5; }
    .title { fill: #14212B; font-family: Fraunces, Georgia, 'Times New Roman', serif; font-size: 17px; font-weight: 600; }
    .sub { fill: #4A5963; font-size: 11.5px; }
    .label { fill: #4A5963; font-size: 11.5px; font-style: italic; }
    .mono { font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; }
  </style>

  <rect width="960" height="400" fill="#E6E9EA"/>

  <defs>
    <marker id="ink" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#14212B"/>
    </marker>
    <marker id="rust" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#A8420E"/>
    </marker>
    <marker id="muted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8B949B"/>
    </marker>
  </defs>

  <!-- playQueue -->
  <rect class="box" x="20" y="165" width="150" height="70" rx="6"/>
  <text class="title" x="95" y="196" text-anchor="middle">playQueue()</text>
  <text class="sub" x="95" y="216" text-anchor="middle">one queue, one API</text>

  <!-- server check -->
  <rect class="box" x="215" y="165" width="160" height="70" rx="6"/>
  <text class="title" x="295" y="196" text-anchor="middle">Server alive?</text>
  <text class="sub mono" x="295" y="216" text-anchor="middle">/api/health · 2.5 s</text>

  <!-- /api/stream -->
  <rect class="box" x="425" y="128" width="170" height="64" rx="6"/>
  <text class="title" x="510" y="156" text-anchor="middle">/api/stream</text>
  <text class="sub mono" x="510" y="176" text-anchor="middle">ytsearch1 · disk cache</text>

  <!-- hidden WebView -->
  <rect class="box" x="425" y="250" width="170" height="70" rx="6"/>
  <text class="title" x="510" y="280" text-anchor="middle">Hidden WebView</text>
  <text class="sub mono" x="510" y="300" text-anchor="middle">m.youtube.com, 0% opacity</text>

  <!-- expo-audio -->
  <rect x="645" y="60" width="160" height="70" rx="6" fill="#14212B"/>
  <text class="title" x="725" y="91" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">expo-audio</text>
  <text x="725" y="111" text-anchor="middle" font-size="11.5" fill="#CBD0D3">native player</text>

  <!-- silence anchor -->
  <rect class="box" x="645" y="255" width="160" height="60" rx="6" stroke="#A8420E"/>
  <text class="title" x="725" y="282" text-anchor="middle">silence.wav</text>
  <text class="sub" x="725" y="300" text-anchor="middle">looping session anchor</text>

  <!-- media session -->
  <rect class="box" x="845" y="60" width="100" height="255" rx="6"/>
  <text class="title" x="895" y="160" text-anchor="middle" font-size="15">Android</text>
  <text class="sub" x="895" y="186" text-anchor="middle">lock screen</text>
  <text class="sub" x="895" y="204" text-anchor="middle">notification</text>
  <text class="sub" x="895" y="222" text-anchor="middle">widgets</text>

  <!-- local file: playQueue -> expo-audio -->
  <path class="flow" d="M95,165 V95 H645" stroke="#14212B" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <text class="label" x="300" y="85" text-anchor="middle">downloaded file</text>

  <!-- spotify like: playQueue -> server check -->
  <path class="flow" d="M170,200 H215" stroke="#A8420E" stroke-width="2" fill="none" marker-end="url(#rust)"/>
  <text class="label" x="193" y="255" text-anchor="middle">Spotify like</text>

  <!-- online -> /api/stream -->
  <path class="flow" d="M375,188 C400,188 400,160 425,160" stroke="#A8420E" stroke-width="2" fill="none" marker-end="url(#rust)"/>
  <text class="label" x="398" y="150" text-anchor="middle">yes</text>

  <!-- offline -> WebView -->
  <path class="flow" d="M375,215 C400,215 400,285 425,285" stroke="#A8420E" stroke-width="2" fill="none" marker-end="url(#rust)"/>
  <text class="label" x="383" y="300" text-anchor="end">no / timeout</text>

  <!-- /api/stream -> expo-audio -->
  <path class="flow" d="M595,160 C625,160 625,125 645,118" stroke="#A8420E" stroke-width="2" fill="none" marker-end="url(#rust)"/>

  <!-- watchdog: expo-audio failed to load -> WebView -->
  <path class="flow" d="M690,130 C690,215 620,225 595,268" stroke="#8B949B" stroke-width="1.5" fill="none" marker-end="url(#muted)"/>
  <text class="label" x="700" y="210">watchdog, 20 s</text>

  <!-- WebView <-> silence anchor -->
  <path d="M595,292 H645" stroke="#A8420E" stroke-width="2" stroke-dasharray="2 4" fill="none"/>
  <text class="label" x="620" y="340" text-anchor="middle">play / pause mirrored</text>

  <!-- to Android -->
  <path class="flow" d="M805,95 H845" stroke="#14212B" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <path class="flow" d="M805,285 H845" stroke="#A8420E" stroke-width="2" fill="none" marker-end="url(#rust)"/>

  <text x="480" y="378" fill="#4A5963" font-size="12.5" text-anchor="middle">Same queue, same controls. The engine is picked per track, and the lock screen never learns which one is playing.</text>
</svg>
