name: GitHub Pages

on:
  push:
    branches:
      - astro-migration # production deploy
    paths-ignore:
      - "**.md"
      - "!src/content/**/*.md" # blog posts / case studies still deploy
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: ./dist

  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/astro-migration' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: ./dist

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.cristhIAn }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: www.cristhianwiki.com

      - name: Ping IndexNow (Bing/Yandex instant indexing)
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' dist/sitemap-0.xml | sed 's/<loc>//;s#</loc>##' | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().split()))")
          curl -s -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"www.cristhianwiki.com\",\"key\":\"d8233fe13897a43eb598e5aef61599ee\",\"keyLocation\":\"https://www.cristhianwiki.com/d8233fe13897a43eb598e5aef61599ee.txt\",\"urlList\":$urls}"
